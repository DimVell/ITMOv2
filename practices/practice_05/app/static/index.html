<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notify Mini — подписчики</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Notify Mini</p>
        <h1 id="page-title">Список тех, кто хочет быть в курсе</h1>
        <p class="intro">Добавьте подписчика — имя появится в общем списке без перезагрузки.</p>
      </section>

      <section class="panel" aria-labelledby="form-title">
        <div>
          <p class="step">01 / Добавление</p>
          <h2 id="form-title">Новый подписчик</h2>
        </div>
        <form id="subscriber-form" novalidate>
          <label for="subscriber-name">Имя</label>
          <div class="form-row">
            <input
              id="subscriber-name"
              name="name"
              type="text"
              maxlength="40"
              autocomplete="name"
              placeholder="Например, Анна"
              required
            >
            <button type="submit">Добавить</button>
          </div>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="list-heading">
          <div>
            <p class="step">02 / Результат</p>
            <h2 id="list-title">Подписчики</h2>
          </div>
          <span id="subscriber-count" class="count" aria-label="Количество подписчиков">0</span>
        </div>
        <ul id="subscriber-list" class="subscriber-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">Пока никого нет. Добавьте первого подписчика.</p>
      </section>
    </main>
  </body>
</html>
